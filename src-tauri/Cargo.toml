[package]
name = "xiangyu-anhui"
version = "0.1.0"
description = "乡遇安徽 · 一纸山河"
authors = ["Hldwsd"]
edition = "2021"

[lib]
name = "xiangyu_anhui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
