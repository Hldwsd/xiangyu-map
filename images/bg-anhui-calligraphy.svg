<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!--
    宣纸底 + 新安画派式远山 + 大字「皖 / 徽」。
    只用纸墨系统字体，不引入 webfont；字符用极低透明度，保证地图与卡片仍然是最前面的信息。
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e7" />
      <stop offset="0.55" stop-color="#f4eee2" />
      <stop offset="1" stop-color="#efe8da" />
    </linearGradient>

    <radialGradient id="wash" cx="62%" cy="42%" r="52%">
      <stop offset="0" stop-color="#1c1a17" stop-opacity="0.05" />
      <stop offset="0.7" stop-color="#1c1a17" stop-opacity="0.015" />
      <stop offset="1" stop-color="#1c1a17" stop-opacity="0" />
    </radialGradient>

    <!-- 纸纹：极细的斜向纤维，避免大面积纯色发闷 -->
    <pattern id="fibre" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1a17" stroke-opacity="0.03" stroke-width="0.7" />
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)" />
  <rect width="1600" height="1000" fill="url(#fibre)" />
  <rect width="1600" height="1000" fill="url(#wash)" />

  <!-- 远山：三层，越远越淡 -->
  <g fill="none" stroke="#1c1a17" stroke-linecap="round">
    <path
      d="M120 690c90-120 150-190 232-190s120 66 176 130c52-58 96-96 160-96s120 54 186 122c62-72 108-112 180-112s150 78 246 210"
      stroke-opacity="0.05"
      stroke-width="3"
    />
    <path
      d="M60 780c110-96 176-150 258-150s132 52 196 108c56-52 108-86 176-86s118 44 182 100c70-62 124-96 196-96s150 62 246 158"
      stroke-opacity="0.07"
      stroke-width="3.4"
    />
    <path
      d="M-20 900c140-92 220-140 318-140s150 46 224 96c62-44 120-72 192-72s126 36 196 86c78-56 138-84 218-84s168 54 272 132"
      stroke-opacity="0.1"
      stroke-width="4"
    />
  </g>

  <!-- 水纹：极淡的横线，暗示长江/淮河 -->
  <g stroke="#1c1a17" stroke-opacity="0.045" stroke-width="2.2" stroke-linecap="round">
    <path d="M180 842c120-14 240-14 360 0s240 14 360 0 240-14 360 0" fill="none" />
    <path d="M260 880c110-12 220-12 330 0s220 12 330 0 220-12 330 0" fill="none" />
  </g>

  <!-- 大字：皖 / 徽 -->
  <g font-family="'Kaiti SC','STKaiti','KaiTi','楷体','Songti SC','SimSun',serif" fill="#1c1a17">
    <text
      x="980"
      y="470"
      font-size="520"
      text-anchor="middle"
      fill-opacity="0.055"
      letter-spacing="12"
    >
      皖
    </text>
    <text
      x="330"
      y="880"
      font-size="420"
      text-anchor="middle"
      fill-opacity="0.045"
      transform="rotate(-6 330 880)"
      letter-spacing="8"
    >
      徽
    </text>
  </g>

  <!-- 印章：只有描边，不抢视觉 -->
  <g transform="translate(1318 250)">
    <rect width="96" height="96" fill="none" stroke="#b08a4a" stroke-opacity="0.35" stroke-width="2" />
    <text
      x="48"
      y="70"
      font-family="'Kaiti SC','STKaiti','KaiTi','楷体','Songti SC','SimSun',serif"
      font-size="58"
      text-anchor="middle"
      fill="#b08a4a"
      fill-opacity="0.5"
    >
      徽
    </text>
  </g>
</svg>
