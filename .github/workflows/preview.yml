name: Preview

# 每个 PR 一份预览：构建到 gh-pages 的 pr-<n>/ 子目录，并在 PR 里贴一条可点的链接。
# 已知限制：GitHub Pages 只有根目录一个 404.html，预览站的深链会落到主站的 404 页；
# 预览以首页为准，深链行为在合并进 main 后才是准确的。
# 并发：本工作流自己一个 concurrency 组（新的预览会顶掉排队的旧预览，符合直觉）；
# 与 deploy.yml 的并发写同一分支由推送重试解决，见 Issue #27。

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

env:
  PREVIEW_BASE: /${{ github.event.repository.name }}/pr-${{ github.event.number }}/

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build-only --base=${{ env.PREVIEW_BASE }}

      - name: Publish preview
        # 同 deploy.yml：自己做推送以便失败重试（与部署同时写 gh-pages 时不至于红掉）
        run: |
          set -euo pipefail
          dir="pr-${PR_NUMBER}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            rm -rf /tmp/pages
            git clone --depth=1 --branch gh-pages "$remote" /tmp/pages
            rm -rf "/tmp/pages/$dir"
            mkdir -p "/tmp/pages/$dir"
            cp -a dist/. "/tmp/pages/$dir/"
            cd /tmp/pages
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if git diff --cached --quiet; then
              echo "预览内容无变化，跳过推送"
              exit 0
            fi
            git commit -q -m "ci(preview): PR #${PR_NUMBER} @ ${HEAD_SHA}"
            if git push origin gh-pages; then
              echo "预览已发布（第 $attempt 次尝试）"
              exit 0
            fi
            echo "第 $attempt 次推送失败，退避重试"
            sleep $((attempt * 5))
          done
          echo "推送 gh-pages 连续失败 3 次" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/
        with:
          script: |
            const marker = '<!-- deploy-preview -->'
            const body = [
              marker,
              '### 预览环境已更新',
              '',
              `- 预览地址：${process.env.PREVIEW_URL}`,
              `- 版本：\`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              '',
              '每次推送到本 PR 都会重新构建；合并进 main 后主站地址：' +
                `https://${context.repo.owner}.github.io/${context.repo.repo}/`,
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview directory
        run: |
          set -euo pipefail
          dir="pr-${PR_NUMBER}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            rm -rf /tmp/pages
            git clone --depth=1 --branch gh-pages "$remote" /tmp/pages
            cd /tmp/pages
            if [ ! -d "$dir" ]; then
              echo "没有 $dir 目录，跳过"
              exit 0
            fi
            git rm -r --quiet "$dir"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -q -m "ci(preview): 清理 PR #${PR_NUMBER} 的预览目录"
            if git push origin gh-pages; then
              echo "已清理（第 $attempt 次尝试）"
              exit 0
            fi
            echo "第 $attempt 次推送失败，退避重试"
            sleep $((attempt * 5))
          done
          echo "推送 gh-pages 连续失败 3 次" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
