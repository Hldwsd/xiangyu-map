name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 版本由 package.json 的 packageManager 决定；这里再写 version 会被
        # action 判定为「两处指定版本」直接失败。
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit --run

      - name: Build
        run: pnpm build-only

      - name: Pre-render detail pages
        run: pnpm prerender
        env:
          SITE_URL: http://localhost:4173/
