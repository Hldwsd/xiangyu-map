name: Deploy

# main 合并即上线：构建 → 塞进 gh-pages 根目录 → GitHub Pages 发布。
# 为什么用 gh-pages 分支而不是官方 actions/deploy-pages：PR 预览需要把每个 PR 的构建
# 放在同一个站点的子目录下（/pr-<n>/），官方 Pages 部署一次只能推进一个产物包。
# 详见 docs/adr/0003-deployment.md。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 独立的 concurrency group。以前这里和 preview.yml 共用 gh-pages-deploy，本意是让两次
# 推 gh-pages 串行；但 GitHub 的语义是「同组里新排队的运行会取消此前 pending 的运行」
# （即使 cancel-in-progress: false），于是合并 PR 时 push:main 的部署会被 pull_request:closed
# 的预览清理挤掉——运行状态是 cancelled、jobs 为空，线上静默不更新（见 Issue #27）。
# 现在各用各的组，靠下面「推送失败就 fetch 重试」解决并发写同一分支的问题。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  PAGES_DIR: .
  COMMIT_MSG: 'ci(deploy): 发布 main @ ${{ github.sha }}'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # 地图挂到 /<repo>/map/，根路径留给品牌页
        run: pnpm build-only --base=/${{ github.event.repository.name }}/map/

      - name: Pre-render detail pages
        # 构建后把 detail 页注入静态 meta（title/OG/JSON-LD），微信与搜索引擎才拿得到
        run: pnpm prerender
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/map/

      - name: Reorganize (map under /map/, brand at root)
        # 线上根路径是品牌页；地图整体挪到 /map/，品牌页的「进入地图」指向 ./map/
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          mkdir -p site
          mv dist site/map
          cp site/map/brand/index.html site/index.html
          python - <<'PY'
          from pathlib import Path
          page = Path('site/index.html')
          text = page.read_text(encoding='utf-8').replace('href="../"', 'href="./map/"')
          page.write_text(text, encoding='utf-8')
          PY
          cp site/index.html site/404.html

      - name: Publish
        # 不用 peaceiris/actions-gh-pages：它没有推送重试，而 Preview 工作流随时可能
        # 同时推 gh-pages（预览构建/清理），一次 non-fast-forward 就会让部署红掉。
        # 这里克隆 gh-pages、只替换根目录产物（pr-* 原样保留）、失败退避重试 3 次。
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            rm -rf /tmp/pages
            git clone --depth=1 --branch gh-pages "$remote" /tmp/pages
            # 清根目录，但保留 pr-*（每个 PR 的预览产物归 preview.yml 管）
            find /tmp/pages -mindepth 1 -maxdepth 1 \
              -not -name 'pr-*' -not -name '.git' -exec rm -rf {} +
            cp -a site/. /tmp/pages/
            cd /tmp/pages
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if git diff --cached --quiet; then
              echo "gh-pages 内容无变化，跳过推送"
              exit 0
            fi
            git commit -q -m "$COMMIT_MSG"
            if git push origin gh-pages; then
              echo "已发布（第 $attempt 次尝试）"
              exit 0
            fi
            echo "第 $attempt 次推送失败，可能是 Preview 同时推送，退避重试"
            sleep $((attempt * 5))
          done
          echo "推送 gh-pages 连续失败 3 次" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
